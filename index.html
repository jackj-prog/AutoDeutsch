<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AutoDeutsch" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="description" content="AutoDeutsch — 1000+ German cards with spaced repetition, 9 study modes, hands-free audio" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png" />
  <!-- Montserrat in <head> (not injected late by React) so the brand font requests fire at
       first paint — no flash of fallback. preconnect warms the font CDN; the service worker
       runtime-caches the CSS + woff2 (cache-first) for offline use. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" />
  <title>AutoDeutsch</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    /* NOTE: do NOT put overflow-x:hidden on html/body — it forces overflow-y:auto, makes the
       body a scroll container, and breaks the fixed bottom nav / 100vh on mobile (a dead gap
       appears below the tab bar). Horizontal overflow is instead prevented at source: every
       grid uses minmax(0,1fr) and text truncates with ellipsis. */
    body {
      /* Match the app's top-glow start colour so the notch / status-bar area blends with
         the app background instead of showing a flat seam. The app fills edge-to-edge
         (no body safe-area padding) and each screen insets its own content, so the
         radial gradient now reaches up under the notch. */
      background: radial-gradient(125% 48% at 50% -6%, rgba(255,200,40,0.10) 0%, rgba(255,200,40,0.02) 28%, #090909 60%);
      background-color: #090909;
      color: #F0EDE5;
      font-family: 'Montserrat', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    input[type="range"] {
      -webkit-appearance: none;
      height: 6px;
      background: linear-gradient(90deg, #1A1A1A 33%, #DD0000 33% 66%, #FFCC00 66%);
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #FFCC00;
      border: 2px solid #0A0A0A;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(255,204,0,0.4);
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #FFCC00;
      border: 2px solid #0A0A0A;
      cursor: pointer;
    }
    button { font-family: inherit; transition: transform 0.1s, opacity 0.1s; }
    button:active { transform: scale(0.96); opacity: 0.9; }
    ::-webkit-scrollbar { width: 0; }
    input:focus {
      border-color: #FFCC00 !important;
      box-shadow: 0 0 0 3px rgba(255,204,0,0.2);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Block accidental pinch-zoom / double-tap zoom. iOS Safari ignores user-scalable=no
       in-browser, so we also cancel the gesture events directly. Zoom adds no value to a
       full-screen flash-card trainer and misfires constantly during fast swipe/typing. -->
  <script>
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
    var __lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - __lastTouchEnd < 300) e.preventDefault();
      __lastTouchEnd = now;
    }, { passive: false });
  </script>

  <script crossorigin="anonymous" referrerpolicy="no-referrer" integrity="sha512-8Q6Y9XnTbOE+JNvjBQwJ2H8S+UV4uA6hiRykhdtIyDYZ2TprdNmWOUaKdGzOhyr4dCyk287OejbPvwl7lrfqrQ==" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" referrerpolicy="no-referrer" integrity="sha512-MOCpqoRoisCTwJ8vQQiciZv0qcpROCidek3GTFS6KTk2+y7munJIlKCVkFCYY+p3ErYFXCjmFjnfTTRSC1OHWQ==" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="data.js" integrity="sha512-HolVxMvLfbKPYjCSL9Bu3LEOWWfkld19bLwR0UjN626CN74sJMt2e7GbIiAamEZp6dNZ8TdCPiK4lut+iJYyrw=="></script>
  <script src="app.js" integrity="sha512-PogFdY5bAMbZAfzMCHFx3B5KAD2lPud3krD+/YWoBs5UwmimKJsN3A1MB3dXyiJemUut4mFl7xIGd5y8xJroQQ=="></script>

  <!-- Boot-failure self-heal: if the app didn't mount (e.g. a cached data.js/app.js was
       blocked by an SRI mismatch after a deploy), purge CacheStorage once and reload so
       every file is re-fetched fresh and consistent. Runs at most once per session and
       never offline, so it cannot loop or strand an offline user. -->
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var root = document.getElementById('root');
        var booted = root && root.childElementCount > 0;
        if (booted || !navigator.onLine) return;
        if (sessionStorage.getItem('ad-selfheal')) return;
        try { sessionStorage.setItem('ad-selfheal', '1'); } catch (e) {}
        var purge = ('caches' in window)
          ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
          : Promise.resolve();
        purge.catch(function () {}).then(function () { window.location.reload(); });
      }, 4000);
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => {
            console.log('SW registered:', reg.scope);
            // Expose the registration globally so the React app can trigger manual checks
            window.__SW_REG__ = reg;
            // Watch for a new worker installing
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  // A new version is waiting. Tell the app.
                  window.__SW_WAITING__ = nw;
                  window.dispatchEvent(new CustomEvent('sw-update-available'));
                }
              });
            });
            // Check immediately on load, then every 5 minutes, then whenever the tab regains focus
            reg.update().catch(() => {});
            setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);
            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') reg.update().catch(() => {});
            });
          })
          .catch(err => console.log('SW registration failed:', err));

        // When the new SW takes control, reload so the user sees the new version.
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
